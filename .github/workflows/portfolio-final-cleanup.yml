name: Portfolio final cleanup verification
on:
  push:
    branches: [portfolio-final-cleanup]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: portfolio-final-cleanup
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: portfolio-final-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Prepare web media
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

          if [ ! -f public/figures/fe-validation/thor5f-positioning-workflow-web.png ]; then
            ffmpeg -loglevel error -y               -i public/figures/fe-validation/thor5f-positioning-workflow.png               -vf "scale=2400:1420:flags=lanczos" -frames:v 1 -compression_level 9               public/figures/fe-validation/thor5f-positioning-workflow-web.png
          fi

          if [ ! -f public/figures/bladder-test-platform/echoscope-simba-pcb-v4-1-web.png ]; then
            ffmpeg -loglevel error -y               -i public/figures/bladder-test-platform/echoscope-simba-pcb-v4-1.png               -vf "scale=800:450:force_original_aspect_ratio=decrease,pad=800:450:(ow-iw)/2:(oh-ih)/2:color=white"               -frames:v 1 -compression_level 9               public/figures/bladder-test-platform/echoscope-simba-pcb-v4-1-web.png
          fi

          if [ ! -f public/videos/.optimized-v1 ]; then
            files=(
              public/videos/thorrigidbenchgeneralsim.mp4
              public/videos/THORsemiRIGIDBENCHgeneralsim.mp4
              public/videos/THOR_RIGID_BENCH_SHOULDER_FOREAFTCOMPARISON.mp4
              public/videos/THOR_SEMIRIGID_BENCH_SHOULDER_FOREAFTCOMPARISON.mp4
              public/videos/THOR_RIGID_BENCH_SHOULDER_INBOARDOUTBOARDCOMPARISON.mp4
              public/videos/THOR_SEMIRIGID_BENCH_SHOULDER_INBOARDOUTBOARDCOMPARISON.mp4
            )
            for f in "${files[@]}"; do
              out="${f%.mp4}.optimized.mp4"
              ffmpeg -loglevel error -y -i "$f" -an -c:v libx264 -preset medium -crf 26 -movflags +faststart -pix_fmt yuv420p "$out"
              old_size=$(stat -c%s "$f")
              new_size=$(stat -c%s "$out")
              if [ "$new_size" -lt "$old_size" ]; then mv "$out" "$f"; else rm "$out"; fi
            done
            touch public/videos/.optimized-v1
          fi
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run audit
        env:
          CHROME_PATH: /usr/bin/google-chrome
          AUDIT_PERFORMANCE: '0'
      - name: Print audit diagnostics
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          for (const file of readdirSync('test-results').filter(f=>f.endsWith('.json') && f!=='summary.json')) {
            const j=JSON.parse(readFileSync('test-results/'+file,'utf8'));
            for (const id of ['color-contrast','label-content-name-mismatch','definition-list']) {
              const a=j.audits?.[id];
              if (a && a.score!==null && a.score<1) console.log('DIAGNOSTIC',file,id,JSON.stringify(a.details?.items||[]));
            }
          }
          NODE
      - name: Commit generated media
        if: success()
        shell: bash
        run: |
          if ! git diff --quiet || [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/figures/fe-validation/thor5f-positioning-workflow-web.png                     public/figures/bladder-test-platform/echoscope-simba-pcb-v4-1-web.png                     public/videos
            git commit -m "Optimize portfolio media for web"
            git push origin HEAD:portfolio-final-cleanup
          fi
